<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Foul Play</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>Foul Play</h1>
    <select id="iterations" title="More iterations = stronger but slower">
      <option value="1500">Quick</option>
      <option value="5000" selected>Normal</option>
      <option value="15000">Thorough</option>
    </select>
  </header>

  <button id="calc">Calculate best move</button>
  <p id="status"></p>

  <div id="results" hidden>
    <section>
      <h2>Your options</h2>
      <ol id="my-moves" class="move-list"></ol>
    </section>
    <section>
      <h2>Likely opponent response</h2>
      <ol id="opp-moves" class="move-list"></ol>
    </section>
    <p class="meta" id="meta"></p>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
