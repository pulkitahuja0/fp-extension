<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Foul Play</title>
        <link rel="stylesheet" href="popup.css" />
    </head>
    <body>
        <header>
            <h1>Foul Play</h1>
            <select id="search-budget">
                <option value="2,1000">2k over 2 worlds</option>
                <option value="5,5000">25k over 5 worlds</option>
                <option value="5,10000" selected>50k over 5 worlds</option>
                <option value="5,50000">250k over 5 worlds</option>
            </select>
        </header>

        <button id="calc">Calculate best move</button>
        <p id="status"></p>

        <div id="results" hidden>
            <section>
                <h2 id="my-moves-heading">Your options</h2>
                <ol id="my-moves" class="move-list"></ol>
            </section>
            <section>
                <h2 id="opp-moves-heading">Likely opponent response</h2>
                <ol id="opp-moves" class="move-list"></ol>
            </section>
            <p class="meta" id="meta"></p>
        </div>

        <script type="module" src="popup.js"></script>
    </body>
</html>
