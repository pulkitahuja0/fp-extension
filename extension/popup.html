<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Foul Play</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>Foul Play</h1>
    <select id="search-budget" title="More sampled worlds & iterations = stronger but slower">
      <option value="4,1500">Quick</option>
      <option value="6,3000">Normal</option>
      <option value="8,6000" selected>Thorough</option>
      <option value="10,12000">Rigorous</option>
    </select>
  </header>

  <button id="calc">Calculate best move</button>
  <p id="status"></p>

  <div id="results" hidden>
    <section>
      <h2 id="my-moves-heading">Your options</h2>
      <ol id="my-moves" class="move-list"></ol>
    </section>
    <section>
      <h2 id="opp-moves-heading">Likely opponent response</h2>
      <ol id="opp-moves" class="move-list"></ol>
    </section>
    <p class="meta" id="meta"></p>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
